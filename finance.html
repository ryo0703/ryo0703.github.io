<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="資金管理">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" id="tcLight" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="tcDark" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>資金管理</title>
<style>
:root{
  color-scheme:light;
  /* 白い紙と紺のインク。面はほぼ無彩色にして、色は残高カード・グラフ・状態の丸だけに使う */
  --bg:#f4f5f7;--card:#ffffff;--raised:#eef0f3;--field:#ffffff;--seg-on:#ffffff;
  --ink:#141922;--sub:#4b5363;--muted:#666e7e;--faint:#959ba7;
  --line:rgba(20,25,34,.08);--line2:rgba(20,25,34,.14);
  --accent:#24418a;--accent-strong:#24418a;--accent-soft:rgba(36,65,138,.08);
  --btn-bg:#24418a;--btn-ink:#ffffff;
  --pos:#157a42;--neg:#c3313a;
  --dot-ok:#1f9d55;--dot-warn:#d99a1c;--dot-bad:#dc3d45;
  --hero:#203a7c;--hero-neg:#8a2333;
  --bar:#dde1e7;--bar-strong:#b4bbc7;--bar-sel:#24418a;
  --tabbar:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(16,24,40,.05);--float:0 8px 24px rgba(16,24,40,.10);
  --toast-bg:#141922;--toast-ink:#f4f5f7;--toast-act:#a9bcf0;
  --ease:cubic-bezier(.22,1,.36,1);
  /* iOS 26以降のホーム画面アプリは、画面の上（ステータスバーとその下30ptくらい）をぼかす。
     その範囲に文字やボタンを置かないためのすき間。上に余白がない端末（横向き・パソコン）では0になる */
  --band:min(36px, env(safe-area-inset-top, 0px) * 1000);
  --top-clear:calc(env(safe-area-inset-top, 0px) + var(--band));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1115;--card:#171a20;--raised:#21252c;--field:#13161b;--seg-on:#343943;--ink:#eceef2;--sub:#aab0bb;--muted:#8b919d;--faint:#666c77;--line:rgba(236,238,242,.08);--line2:rgba(236,238,242,.14);--accent:#9fb3ea;--accent-strong:#3c5cb4;--accent-soft:rgba(159,179,234,.12);--btn-bg:#e9ecf2;--btn-ink:#11141a;--pos:#4cc38a;--neg:#f0686f;--dot-ok:#4cc38a;--dot-warn:#e7b25a;--dot-bad:#f0686f;--hero:#1d2f63;--hero-neg:#64202b;--bar:#2a2f38;--bar-strong:#4c5361;--bar-sel:#8ea5e2;--tabbar:rgba(23,26,32,.88);--shadow:0 0 0 rgba(0,0,0,0);--float:0 8px 24px rgba(0,0,0,.4);--toast-bg:#e9ecf2;--toast-ink:#11141a;--toast-act:#24418a;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1115;--card:#171a20;--raised:#21252c;--field:#13161b;--seg-on:#343943;--ink:#eceef2;--sub:#aab0bb;--muted:#8b919d;--faint:#666c77;--line:rgba(236,238,242,.08);--line2:rgba(236,238,242,.14);--accent:#9fb3ea;--accent-strong:#3c5cb4;--accent-soft:rgba(159,179,234,.12);--btn-bg:#e9ecf2;--btn-ink:#11141a;--pos:#4cc38a;--neg:#f0686f;--dot-ok:#4cc38a;--dot-warn:#e7b25a;--dot-bad:#f0686f;--hero:#1d2f63;--hero-neg:#64202b;--bar:#2a2f38;--bar-strong:#4c5361;--bar-sel:#8ea5e2;--tabbar:rgba(23,26,32,.88);--shadow:0 0 0 rgba(0,0,0,0);--float:0 8px 24px rgba(0,0,0,.4);--toast-bg:#e9ecf2;--toast-ink:#11141a;--toast-act:#24418a;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',system-ui,sans-serif;font-size:15px;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,label{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
button:disabled{cursor:default}
html.lock,html.lock body{overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 線のアイコン（ぜんぶ同じ太さ） */
svg.i{width:18px;height:18px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* 上の見出し */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + max(16px, var(--band))) max(20px,env(safe-area-inset-right)) 16px max(20px,env(safe-area-inset-left))}
.top-date{font-size:13px;color:var(--muted)}
.top h1{font-size:28px;font-weight:600;line-height:1.2}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--sub);box-shadow:var(--shadow),0 0 0 1px var(--line);flex:none}
.icon-btn svg.i{width:20px;height:20px}

/* 残高のカード（通帳の表紙のような紺の無地） */
.hero{color:#fff;background:var(--hero);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:var(--float)}
.hero.neg{background:var(--hero-neg)}
.net-label{font-size:13px;color:rgba(255,255,255,.74)}
.net-amount{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin:4px 0 8px}
.net-sub{font-size:13px;color:rgba(255,255,255,.74);line-height:1.6}
.net-status{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:14px;line-height:1.5}
.net-status .dot{margin-top:7px}
.hero .dot.ok{background:#62d69d}
.hero .dot.warn{background:#f2c055}
.hero .dot.bad{background:#ff8085}

/* 本文 */
.content{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.banner{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 12px 12px 16px;margin-bottom:12px;font-size:14px;line-height:1.5;background:var(--card);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.banner .dot{margin-top:0}
.b-txt{flex:1}
.b-btn{flex:none;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;background:var(--raised);color:var(--ink)}
.b-x{flex:none;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.b-x svg.i{width:16px;height:16px}
.month-card{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow),0 0 0 1px var(--line);text-align:left}
.month-card .mc-l{flex:1;font-size:14px;color:var(--sub)}
.month-card b{font-size:17px;font-weight:500}
svg.chev{width:16px;height:16px;color:var(--faint)}
.section{background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.section.summary{padding:16px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px;margin-bottom:4px}
.sec-title{font-size:13px;font-weight:500;color:var(--sub)}
.sec-note{font-size:12px;color:var(--muted)}
.sec-btns{display:flex;gap:8px}
.add-btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px 0 8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink);background:var(--raised);white-space:nowrap}
.add-btn svg.i{width:16px;height:16px;color:var(--sub)}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;width:100%;min-height:48px;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;text-align:left}
.row-label{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-right{display:flex;align-items:center;gap:4px;flex:none}
.amt{font-size:15px;font-weight:500;white-space:nowrap}
.amt.neg{color:var(--neg)}
.amt.pos{color:var(--pos)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0}
.prow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.p-label{font-size:15px}
.rep{font-size:11px;color:var(--sub);background:var(--raised);padding:1px 6px;border-radius:4px;margin-left:8px;vertical-align:1px}
.p-meta{font-size:13px;color:var(--muted)}
/* このアプリのしるし：間に合う＝緑・あと少し＝黄・足りない＝赤の小さな丸 */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.ok{background:var(--dot-ok)}
.dot.warn{background:var(--dot-warn)}
.dot.bad{background:var(--dot-bad)}
.st{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5}
.st .dot{margin-top:6px}
.st-sub{display:block;font-size:12px;color:var(--muted);padding-left:16px}
.prow-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.done-btn{height:28px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;background:var(--raised);color:var(--ink)}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:12px 0 4px;border-top:1px solid var(--line2)}
.total-label{font-size:13px;color:var(--sub)}
.total-amount{font-size:17px;font-weight:500}
.total-amount.pos{color:var(--pos)}
.nw{white-space:nowrap}
.empty{font-size:14px;color:var(--muted);padding:8px 0 12px;line-height:1.6}

/* 下のメニュー */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:center;padding:8px max(32px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left));background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:500;color:var(--muted)}
.tab svg.i{width:24px;height:24px}
.tab.on{color:var(--accent)}
.fab{flex:none;width:56px;height:56px;margin:-24px 24px 0;border-radius:50%;display:grid;place-items:center;color:var(--btn-ink);background:var(--btn-bg);box-shadow:0 4px 12px rgba(16,24,40,.18);border:4px solid var(--bg)}
.fab svg.i{width:24px;height:24px;stroke-width:2}

/* 下からのシート */
.overlay{display:none;position:fixed;left:0;right:0;top:var(--vv-top,0px);height:var(--vv-h,100%);z-index:100;background:rgba(10,12,16,.42);align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:calc(100% - max(12px, var(--top-clear)));display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.12);animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:none}
html.kb .grab{display:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px;flex:none}
.sheet-title{font-size:17px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--sub);flex:none}
.close-btn svg.i{width:16px;height:16px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 20px 16px;flex:1 1 auto;min-height:0}
.sheet-foot{flex:none;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
html.kb .sheet-foot{padding-bottom:12px}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:4px;margin:4px 0 8px}
.seg button{flex:1;height:32px;border-radius:6px;font-size:14px;font-weight:500;color:var(--sub)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.lbl{font-size:13px;font-weight:500;color:var(--sub);margin:16px 0 8px}
.lbl small{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.quick{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border-radius:10px;background:var(--raised);text-align:left;max-width:180px}
.q-t{display:flex;align-items:center;gap:4px;max-width:100%;font-size:13px;color:var(--sub)}
.q-t svg.i{width:16px;height:16px}
.q-t em{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip b{font-size:15px;font-weight:500}
.qchip small{font-size:11px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px;background:var(--raised);font-size:11px;color:var(--sub);text-align:center;line-height:1.3}
.cat svg.i{width:22px;height:22px}
.cat.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:500}
.amount-box{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--line2);padding:4px 0}
.amount-box:focus-within{border-color:var(--accent)}
.amount-box .ym{font-size:20px;font-weight:500;color:var(--muted)}
.amount-box input{flex:1;min-width:0;border:none;background:transparent;font-size:32px;font-weight:500;text-align:right;color:var(--ink);outline:none;padding:0;-webkit-appearance:none;appearance:none;border-radius:0}
.amount-box.sm input{font-size:24px}
.amount-box input::placeholder{color:var(--faint)}
.sign-btn{flex:none;align-self:center;min-width:40px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);color:var(--sub);font-size:16px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;background:var(--raised);border-radius:10px;padding:8px 12px;font-size:14px;text-align:left;line-height:1.35}
.chip small{font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.on small{color:var(--accent)}
.inp{width:100%;height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;font-size:16px;background:var(--field);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--accent)}
.row2{display:flex;gap:8px;align-items:stretch}
.row2 .inp{flex:1;min-width:0}
.datepick{position:relative;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:10px;background:var(--raised);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.datepick svg.i{width:16px;height:16px;color:var(--sub)}
.datepick.empty .dp-t{color:var(--muted)}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.mini{align-self:center;height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--sub);background:var(--raised)}
.toggle{position:relative;display:flex;align-items:center;gap:12px;margin:16px 0 4px;font-size:15px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .tg{width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:background-color .16s var(--ease)}
.toggle .tg::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .16s var(--ease)}
.toggle input:checked+.tg{background:var(--accent-strong)}
.toggle input:checked+.tg::after{transform:translateX(20px)}
.toggle input:focus-visible+.tg{outline:2px solid var(--accent);outline-offset:2px}
.toggle small{display:block;font-size:13px;color:var(--muted)}
.toggle.disabled{opacity:.45}
.btn{display:block;width:100%;height:48px;line-height:48px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:600;color:var(--btn-ink);background:var(--btn-bg);text-align:center}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--raised);color:var(--ink)}
.btn.danger{background:var(--neg);color:#fff}
.btn.ghost.danger{background:var(--raised);color:var(--neg)}
.foot-row{display:flex;gap:8px}
.foot-row .btn{flex:1}
.foot-row .btn.ghost.danger{flex:0 0 32%}
.mt{margin-top:12px}
.box{background:var(--raised);border-radius:12px;padding:16px;margin:8px 0 4px}
.box .btn.ghost{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.box-title{font-size:15px;font-weight:600}
.box .btn+.btn{margin-top:8px}
.hint{font-size:13px;color:var(--muted);line-height:1.65;margin:8px 0 12px}
.acc-big{font-size:32px;font-weight:500;letter-spacing:-.01em;margin:0 0 8px}
.acc-big.neg{color:var(--neg)}
.adj-preview{font-size:13px;color:var(--muted);margin:12px 0}
.adj-preview b{font-weight:500}
.adj-preview.neg{color:var(--neg)}
.adj-preview.pos,.adj-preview.ok{color:var(--pos)}
.confirm-msg{font-size:15px;line-height:1.7;white-space:pre-line;margin:8px 0 4px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0;left:0;top:0}
.help{padding-left:1.3em;margin-top:8px}
.help li{font-size:14px;line-height:1.7;margin-bottom:12px}
.help b{display:block;font-weight:600}
.ver{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
.err{animation:shake .32s var(--ease);border-color:var(--neg)!important}
@keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

/* 履歴 */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.month-nav button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--raised);color:var(--sub)}
.month-nav button svg.i{width:20px;height:20px}
.month-nav button:disabled{opacity:.35}
.month-nav span{font-size:17px;font-weight:600}
.hist-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist-sum div{background:var(--raised);border-radius:8px;padding:12px}
.hist-sum span{display:block;font-size:13px;color:var(--sub)}
.hist-sum b{font-size:20px;font-weight:500}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.chart .b{fill:var(--bar)}
.chart .sel .b{fill:var(--bar-sel)}
.chart .base{stroke:var(--line2);stroke-width:1}
.chart text{text-anchor:middle}
.chart .v{font-size:10px;fill:var(--muted)}
.chart .m{font-size:11px;fill:var(--muted)}
.chart .sel .v,.chart .sel .m{fill:var(--ink);font-weight:600}
.chart g{cursor:pointer}
.cat-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.cat-e{width:24px;display:grid;place-items:center;flex:none;color:var(--sub)}
.cat-e svg.i{width:20px;height:20px}
.cat-main{flex:1;min-width:0}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.cat-top span+span{font-weight:500}
.cat-bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.cat-bar i{display:block;height:100%;border-radius:3px;background:var(--bar-strong)}
.cat-bar.unk i{background:var(--neg)}
.cat-pct{width:40px;text-align:right;font-size:12px;color:var(--muted);flex:none}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:16px 0 4px}
.entries>*+*{border-top:1px solid var(--line)}
.entry{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;text-align:left}
.e-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--raised);color:var(--sub)}
.e-main{flex:1;min-width:0;display:flex;flex-direction:column}
.e-t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-a{font-size:15px;font-weight:500;white-space:nowrap;flex:none}
.e-a.pos{color:var(--pos)}
.e-a.mv{color:var(--muted)}

/* お知らせ（元に戻す） */
.toast{position:fixed;left:50%;bottom:calc(var(--kb,0px) + 96px + env(safe-area-inset-bottom));transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:200;background:var(--toast-bg);color:var(--toast-ink);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:16px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--float)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--toast-act);font-weight:600;white-space:nowrap;padding:4px 0}

.btn,.add-btn,.chip,.cat,.qchip,.done-btn,.fab,.icon-btn,.b-btn,.mini,.close-btn,.seg button{transition:transform .12s var(--ease),background-color .12s var(--ease)}
.btn:active:not(:disabled),.add-btn:active,.chip:active,.cat:active,.qchip:active,.done-btn:active,.fab:active,.icon-btn:active,.b-btn:active,.mini:active,.close-btn:active{transform:scale(.97)}
.row:active,.entry:active,.prow-main:active,.month-card:active{opacity:.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabbar" aria-label="メニュー">
  <button type="button" class="tab on" data-act="tab" data-tab="home">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>ホーム</span>
  </button>
  <button type="button" class="fab" data-act="record" aria-label="記録する">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button type="button" class="tab" data-act="tab" data-tab="history">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
    <span>履歴</span>
  </button>
</nav>

<div class="overlay" id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:calc(var(--top-clear, 0px) + 2rem) 2rem 2rem">JavaScriptをオンにしてください。</p></noscript>

<script>
(() => {
  'use strict';

  /* ===== 基本設定 ===== */
  const KEY = 'shikin.v2';        // 新しい保存場所
  const OLD_KEY = 'financeData';  // 前のバージョンの保存場所（消さずに残しておく）
  const APP_VER = '2.4';
  const BACKUP_DAYS = 14;         // これ以上バックアップしていないとお知らせ
  const DAY = 86400000;

  const OUT_CATS = [['食事', 'food'], ['コンビニ', 'store'], ['交通', 'train'], ['遊び', 'game'], ['旅行', 'plane'], ['趣味', 'music'], ['服・美容', 'shirt'], ['勉強', 'book'], ['プレゼント', 'gift'], ['その他', 'more']];
  const IN_CATS = [['バイト代', 'work'], ['お小遣い', 'wallet'], ['フリマ', 'tag'], ['もらった', 'gift'], ['その他', 'more']];

  /* 線のアイコン（24×24、太さ1.5でそろえる） */
  const ICONS = {
    food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>',
    store: '<path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12.2V20h14v-7.8"/><path d="M10 20v-5h4v5"/>',
    train: '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14"/><path d="M9 21l1.5-4M15 21l-1.5-4"/><path d="M8.5 13.5h.01M15.5 13.5h.01"/>',
    game: '<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6C2.6 9.4 2 14.5 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.4-1.4A2 2 0 0 1 9.8 16h4.4a2 2 0 0 1 1.4.6L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.5-.6-6.6-.7-7.3A4 4 0 0 0 17.3 5z"/>',
    plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    shirt: '<path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.2a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.4-2.2z"/>',
    book: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    more: '<circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>',
    work: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    tag: '<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><path d="M7.5 7.5h.01"/>',
    unknown: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
    up: '<path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
    move: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    chevron: '<path d="m9 18 6-6-6-6"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    settings: '<path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  };
  const ic = (name, cls = '') => `<svg class="i${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.more}</svg>`;
  const GEAR = ic('settings');

  /* ===== 小さな道具 ===== */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const toHalf = (s) => String(s == null ? '' : s).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  const toInt = (s) => { const d = toHalf(s).replace(/[^0-9]/g, ''); return d ? parseInt(d, 10) : NaN; };
  const toIntSigned = (s) => { const t = toHalf(s).trim(); const n = toInt(t); return isNaN(n) ? NaN : (/^[-−ー－]/.test(t) ? -n : n); };
  const num = (v) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? n : 0; };
  const str = (v) => (v == null ? '' : String(v));
  const arr = (v) => (Array.isArray(v) ? v : []);
  const sum = (list) => list.reduce((s, x) => s + (x.amount || 0), 0);
  const yenNum = (n) => Math.abs(Math.round(n)).toLocaleString('ja-JP');
  const yen = (n) => (n < 0 ? '−' : '') + yenNum(n) + '円';
  const yenNW = (n) => `<span class="nw">${yen(n)}</span>`;
  const yenSigned = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + yenNum(n) + '円';
  const yenShort = (n) => { const a = Math.abs(n); return a >= 10000 ? Math.round(a / 1000) / 10 + '万' : a.toLocaleString('ja-JP'); };

  /* 日付はすべて端末の日付（日本時間）で扱う */
  const WD = '日月火水木金土';
  const pad = (n) => String(n).padStart(2, '0');
  const ymdOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => ymdOf(new Date());
  const isYMD = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const dateOf = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const daysUntil = (s) => Math.round((dateOf(s) - dateOf(today())) / DAY);
  const shiftDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return ymdOf(d); };
  const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const mdw = (s) => { const d = dateOf(s); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
  const md = (s) => { const d = dateOf(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const relDay = (s) => { const n = daysUntil(s); return n === 0 ? '今日' : n === -1 ? '昨日' : n === -2 ? 'おととい' : n === 1 ? '明日' : mdw(s); };
  const validYMD = (y, m, d) => { if (m < 1 || m > 12 || d < 1 || d > 31) return null; const dt = new Date(y, m - 1, d); return dt.getMonth() === m - 1 ? ymdOf(dt) : null; };
  const nextMonth = (s, day) => { const d = dateOf(s); const y = d.getFullYear(), m = d.getMonth() + 1; const dim = new Date(y, m + 1, 0).getDate(); return ymdOf(new Date(y, m, Math.min(day || d.getDate(), dim))); };
  const fmtDateTime = (v) => { const d = new Date(v); if (isNaN(d)) return ''; const y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '年' : ''; return `${y}${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours()}:${pad(d.getMinutes())}`; };

  /* 前のバージョンの「4月25日」「12/25」みたいな日付を読む。読めないものはメモに残す */
  function parseLooseDate(text) {
    const s = toHalf(text).trim();
    let m = s.match(/(\d{4})\s*[年/\-.]\s*(\d{1,2})\s*[月/\-.]\s*(\d{1,2})/);
    if (m) return validYMD(+m[1], +m[2], +m[3]);
    m = s.match(/(\d{1,2})\s*[月/]\s*(\d{1,2})/);
    if (!m) return null;
    const y = new Date().getFullYear();
    const c = [y - 1, y, y + 1].map((yy) => validYMD(yy, +m[1], +m[2])).filter(Boolean);
    c.sort((a, b) => Math.abs(daysUntil(a)) - Math.abs(daysUntil(b)));
    return c[0] || null;
  }

  const catList = (kind) => (kind === 'in' ? IN_CATS : OUT_CATS);
  function catIcon(cat, kind) {
    if (cat === '使途不明') return ic('unknown');
    if (cat === '増えた分') return ic('up');
    const f = catList(kind).find((c) => c[0] === cat);
    return ic(f ? f[1] : 'more');
  }
  function guessCat(label, kind) {
    const rules = kind === 'in'
      ? [[/バイト|給料|給与|時給/, 'バイト代'], [/小遣い/, 'お小遣い'], [/メルカリ|フリマ|ラクマ|売/, 'フリマ'], [/お年玉|祝い|もら/, 'もらった']]
      : [[/ライブ|チケット|フェス|推し|グッズ|CD/, '趣味'], [/旅|ホテル|宿|温泉|新幹線|飛行機|航空/, '旅行'], [/誕生日|プレゼント|ギフト|記念/, 'プレゼント'], [/服|美容|コスメ|ヘア|靴/, '服・美容'], [/参考書|教材|塾|模試|検定/, '勉強'], [/定期|電車|バス|交通|タクシー/, '交通'], [/ご飯|ごはん|ランチ|ディナー|食事/, '食事']];
    for (const [re, c] of rules) if (re.test(label || '')) return c;
    return 'その他';
  }

  /* ===== データの読み書き ===== */
  const blank = () => ({ v: 2, accounts: [], incomes: [], expenses: [], history: [], prefs: { theme: 'auto', lastBackup: null, lastAcc: {}, lastMove: null, introSeen: false, migratedAt: null } });

  function fresh() {
    const d = blank();
    d.accounts = [{ id: uid(), label: '現金', amount: 0 }, { id: uid(), label: '三井住友銀行', amount: 0 }, { id: uid(), label: 'PayPay', amount: 0 }];
    d.prefs.introSeen = true;
    return d;
  }

  function planFrom(x, fromV1) {
    let date = '';
    let memo = str(x.memo);
    if (fromV1) {
      const raw = str(x.date).trim();
      date = raw ? parseLooseDate(raw) || '' : '';
      if (!date && raw && raw !== '未定') memo = raw;
    } else {
      date = isYMD(x.date) ? x.date : '';
    }
    return { id: str(x.id != null ? x.id : uid()), label: str(x.label), amount: Math.max(0, num(x.amount)), date, repeat: !!x.repeat && !!date, day: date ? num(x.day) || dateOf(date).getDate() : null, memo, acc: x.acc != null ? str(x.acc) : null };
  }

  function migrateV1(o) {
    const d = blank();
    d.accounts = arr(o.balances).map((b) => ({ id: str(b.id != null ? b.id : uid()), label: str(b.label), amount: num(b.amount) }));
    d.incomes = arr(o.incomes).map((x) => planFrom(x, true));
    d.expenses = arr(o.expenses).map((x) => planFrom(x, true));
    d.prefs.migratedAt = Date.now();
    return d;
  }

  function normalize(o) {
    if (!o || typeof o !== 'object') throw new Error('invalid');
    if (!Array.isArray(o.accounts) && Array.isArray(o.balances)) return migrateV1(o);
    if (!Array.isArray(o.accounts)) throw new Error('invalid');
    const d = blank();
    d.accounts = o.accounts.map((a) => ({ id: str(a.id != null ? a.id : uid()), label: str(a.label), amount: num(a.amount) }));
    d.incomes = arr(o.incomes).map((x) => planFrom(x, false));
    d.expenses = arr(o.expenses).map((x) => planFrom(x, false));
    d.history = arr(o.history)
      .filter((h) => h && isYMD(h.date) && ['out', 'in', 'move', 'adj'].includes(h.kind))
      .map((h) => ({ id: str(h.id != null ? h.id : uid()), ts: num(h.ts) || Date.now(), date: h.date, kind: h.kind, amount: num(h.amount), acc: h.acc != null ? str(h.acc) : null, from: h.from != null ? str(h.from) : null, to: h.to != null ? str(h.to) : null, cat: str(h.cat), memo: str(h.memo) }));
    if (o.prefs && typeof o.prefs === 'object') Object.assign(d.prefs, o.prefs);
    if (!d.prefs.lastAcc || typeof d.prefs.lastAcc !== 'object') d.prefs.lastAcc = {};
    return d;
  }

  let justMigrated = false;
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (_) { /* 読めないときは下へ */ }
    if (raw) {
      try { return normalize(JSON.parse(raw)); } catch (_) {
        try { localStorage.setItem(KEY + '.broken.' + Date.now(), raw); } catch (__) { /* 退避できなくても続ける */ }
      }
    }
    let old = null;
    try { old = localStorage.getItem(OLD_KEY); } catch (_) { /* なし */ }
    if (old) {
      try { const d = migrateV1(JSON.parse(old)); justMigrated = true; return d; } catch (_) { /* 読めなければ新規 */ }
    }
    return fresh();
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch (_) {
      toast('保存できませんでした。端末の空き容量を確認してください');
      return false;
    }
  }

  /* ===== 状態 ===== */
  let data = load();
  let tab = 'home';
  let histMonth = today().slice(0, 7);
  let form = null;      // いま開いているシートの入力内容
  let undoFn = null;
  let toastTimer = null;
  if (justMigrated) save();

  const acct = (id) => data.accounts.find((a) => a.id === id);
  const accName = (id) => (acct(id) ? acct(id).label : '削除した口座');
  const isEmpty = () => !data.history.length && !data.incomes.length && !data.expenses.length && data.accounts.every((a) => !a.amount);
  const defAcc = (kind) => { const id = data.prefs.lastAcc && data.prefs.lastAcc[kind]; return acct(id) ? id : data.accounts[0] ? data.accounts[0].id : null; };

  /* ===== 記録が残高に与える影響（取り消しは sign=-1） ===== */
  function applyEntry(h, sign) {
    const add = (id, v) => { const a = acct(id); if (a) a.amount += v * sign; };
    if (h.kind === 'out') add(h.acc, -h.amount);
    else if (h.kind === 'in' || h.kind === 'adj') add(h.acc, h.amount);
    else if (h.kind === 'move') { add(h.from, -h.amount); add(h.to, h.amount); }
  }
  function addEntry(e) {
    const h = Object.assign({ id: uid(), ts: Date.now(), acc: null, from: null, to: null, cat: '', memo: '' }, e);
    applyEntry(h, 1);
    data.history.push(h);
    if (h.kind === 'out' || h.kind === 'in') data.prefs.lastAcc[h.kind] = h.acc;
    if (h.kind === 'move') data.prefs.lastMove = { from: h.from, to: h.to };
    return h;
  }
  function updateEntry(id, e) {
    const i = data.history.findIndex((h) => h.id === id);
    if (i < 0) return;
    applyEntry(data.history[i], -1);
    const h = Object.assign({}, data.history[i], e);
    applyEntry(h, 1);
    data.history[i] = h;
  }
  function removeEntry(id) {
    const i = data.history.findIndex((h) => h.id === id);
    if (i < 0) return;
    applyEntry(data.history[i], -1);
    data.history.splice(i, 1);
  }

  /* 変更をまとめて保存し、「元に戻す」を出す */
  function commit(msg, fn) {
    const snap = JSON.stringify(Object.assign({}, data, { prefs: undefined }));
    const restore = () => { data = Object.assign(JSON.parse(snap), { prefs: data.prefs }); };
    fn();
    if (!save()) { restore(); render(); return; }
    render();
    if (msg) toast(msg, () => { restore(); save(); render(); toast('元に戻しました'); });
  }

  /* ===== 目標の計算：今の残高に予定を日付順に足し引きして、足りなくなる所を探す ===== */
  function projection() {
    const t = today();
    let run = sum(data.accounts);
    const st = {};
    let first = null, shortCount = 0;
    const undated = data.expenses.filter((x) => !x.date);
    run -= sum(undated);
    const undShort = Math.max(0, -run);
    undated.forEach((x) => { st[x.id] = { short: undShort, after: run, nextIn: null }; });
    // 日付未定の予定支出が本当にあるときだけ「日付未定に足りない」とする（残高がマイナスなだけなら、日付つきの支出側で出す）
    if (undated.length && undShort > 0) { first = { item: null, short: undShort, n: undated.length }; shortCount += undated.length; }
    const ev = [
      ...data.incomes.filter((x) => x.date && x.date >= t).map((x) => ({ x, k: 'in', d: x.date })),
      ...data.expenses.filter((x) => x.date).map((x) => ({ x, k: 'out', d: x.date < t ? t : x.date })),
    ].sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : a.k === b.k ? 0 : a.k === 'in' ? -1 : 1));
    for (const e of ev) {
      if (e.k === 'in') { run += e.x.amount; continue; }
      run -= e.x.amount;
      const short = Math.max(0, -run);
      // 足りないときは、支払日より後に入る最初の収入（＝間に合わない収入）も覚えておく
      const late = short > 0 ? ev.find((o) => o.k === 'in' && o.d > e.d) : null;
      st[e.x.id] = { short, after: run, nextIn: late ? late.x : null };
      if (short > 0) { shortCount += 1; if (!first) first = { item: e.x, short }; }
    }
    return { st, first, shortCount };
  }

  function monthStats(ym) {
    const out = {}, inn = {};
    let tout = 0, tin = 0;
    for (const h of data.history) {
      if (!h.date.startsWith(ym)) continue;
      if (h.kind === 'out' || (h.kind === 'adj' && h.amount < 0)) {
        const c = h.kind === 'adj' ? '使途不明' : h.cat || 'その他';
        const v = Math.abs(h.amount);
        out[c] = (out[c] || 0) + v; tout += v;
      } else if (h.kind === 'in' || (h.kind === 'adj' && h.amount > 0)) {
        const c = h.kind === 'adj' ? '増えた分' : h.cat || 'その他';
        inn[c] = (inn[c] || 0) + h.amount; tin += h.amount;
      }
    }
    return { out, inn, tout, tin };
  }

  /* よく使う・最近の記録（ワンタップ用） */
  function frequent(kind) {
    const since = shiftDays(today(), -90);
    const map = new Map();
    for (const h of data.history) {
      if (h.kind !== kind || h.date < since || !acct(h.acc)) continue;
      const k = [h.cat, h.memo, h.amount, h.acc].join('|');
      const v = map.get(k) || { cat: h.cat, memo: h.memo, amount: h.amount, acc: h.acc, n: 0, last: 0 };
      v.n += 1; v.last = Math.max(v.last, h.ts);
      map.set(k, v);
    }
    return [...map.values()].sort((a, b) => b.n - a.n || b.last - a.last).slice(0, 6);
  }

  /* ===== 画面 ===== */
  const app = $('#app');
  const sheetEl = () => $('#sheet');

  function render() {
    app.innerHTML = tab === 'home' ? homeHTML() : historyHTML();
    $$('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  }

  function homeHTML() {
    const B = sum(data.accounts), E = sum(data.expenses), I = sum(data.incomes);
    const net = B - E;
    const pj = projection();
    const ms = monthStats(today().slice(0, 7));

    let status = '', stCls = 'bad';
    if (pj.first) {
      const it = pj.first.item;
      if (!it) status = `日付未定の予定支出に ${yenNW(pj.first.short)} 足りません`;
      else if (daysUntil(it.date) < 0) status = `予定日を過ぎた「${esc(it.label)}」に ${yenNW(pj.first.short)} 足りません`;
      else status = `${md(it.date)}の「${esc(it.label)}」に間に合いません。あと ${yenNW(pj.first.short)} 必要です`;
      const others = pj.shortCount - (it ? 1 : pj.first.n);
      if (others > 0) status += `（ほかにも${others}件、間に合わない予定があります）`;
    } else if (data.expenses.length) {
      stCls = net >= 0 ? 'ok' : 'warn';
      status = net >= 0 ? '今の残高で、予定の支払いはすべて間に合います' : '予定収入が入れば、予定の支払いはすべて間に合います';
    }

    let banners = '';
    if (data.prefs.migratedAt && !data.prefs.introSeen) {
      banners += `<div class="banner info"><span class="b-txt">新しくなりました。前のデータはそのまま引き継いでいます。</span><button type="button" class="b-btn" data-act="introHelp">使い方</button><button type="button" class="b-x" data-act="introClose" aria-label="閉じる">${ic('x')}</button></div>`;
    }
    if (isEmpty()) {
      banners += '<div class="banner info"><span class="b-txt">口座をタップして「名前・金額を編集」から、今の金額を入れてください。前のバックアップがあるなら、右上の設定から戻せます。</span></div>';
    } else {
      const lb = data.prefs.lastBackup;
      if (!lb || Date.now() - lb > BACKUP_DAYS * DAY) {
        const txt = lb ? `前回のバックアップから${Math.floor((Date.now() - lb) / DAY)}日たちました` : 'まだバックアップがありません';
        banners += `<div class="banner"><i class="dot warn"></i><span class="b-txt">${txt}</span><button type="button" class="b-btn" data-act="export">保存する</button></div>`;
      }
    }

    const accRows = data.accounts.length
      ? data.accounts.map((a) => `<button type="button" class="row" data-act="account" data-id="${esc(a.id)}"><span class="row-label">${esc(a.label)}</span><span class="row-right"><span class="amt${a.amount < 0 ? ' neg' : ''}">${yen(a.amount)}</span>${ic('chevron', 'chev')}</span></button>`).join('')
      : '<div class="empty">口座がありません。「追加」から作れます。</div>';

    const plist = (list, kind) => {
      const rows = sortPlan(list).map((p) => planRow(p, kind, pj)).join('');
      return rows || `<div class="empty">${kind === 'in' ? 'なし' : 'なし。日付つきで追加すると、あといくら必要かが出ます。'}</div>`;
    };

    return `
<header class="top">
  <div><p class="top-date">${mdw(today())}</p><h1>資金管理</h1></div>
  <button type="button" class="icon-btn" data-act="settings" aria-label="設定">${GEAR}</button>
</header>
<div class="content">
  <section class="hero${net < 0 ? ' neg' : ''}">
    <div class="net-label">予定の支払いをすべて済ませたあと</div>
    <div class="net-amount">${yen(net)}</div>
    <div class="net-sub">今の残高 ${yen(B)} − 予定支出 ${yen(E)}${I ? `<br>予定収入がすべて入ると ${yen(net + I)}` : ''}</div>
    ${status ? `<div class="net-status"><i class="dot ${stCls}"></i><span>${status}</span></div>` : ''}
  </section>
  ${banners}
  <button type="button" class="month-card" data-act="tab" data-tab="history"><span class="mc-l">${new Date().getMonth() + 1}月の支出</span><b>${yen(ms.tout)}</b>${ic('chevron', 'chev')}</button>

  <section class="section">
    <div class="sec-head"><span class="sec-title">口座</span><span class="sec-btns"><button type="button" class="add-btn" data-act="record" data-kind="move">${ic('move')}移動</button><button type="button" class="add-btn" data-act="addAccount">${ic('plus')}追加</button></span></div>
    <div class="rows">${accRows}</div>
    <div class="total-row"><span class="total-label">今の残高</span><span class="total-amount">${yen(B)}</span></div>
  </section>

  <section class="section">
    <div class="sec-head"><span class="sec-title">予定収入</span><button type="button" class="add-btn" data-act="addPlan" data-kind="in">${ic('plus')}追加</button></div>
    <div class="rows">${plist(data.incomes, 'in')}</div>
    ${I ? `<div class="total-row"><span class="total-label">予定収入の合計</span><span class="total-amount pos">+${yen(I)}</span></div>` : ''}
  </section>

  <section class="section">
    <div class="sec-head"><span class="sec-title">予定支出・目標</span><button type="button" class="add-btn" data-act="addPlan" data-kind="out">${ic('plus')}追加</button></div>
    <div class="rows">${plist(data.expenses, 'out')}</div>
    ${E ? `<div class="total-row"><span class="total-label">予定支出の合計</span><span class="total-amount">−${yen(E)}</span></div>` : ''}
  </section>
</div>`;
  }

  const sortPlan = (list) => [...list].sort((a, b) => {
    const da = a.date || '9999-99-99', db = b.date || '9999-99-99';
    return da < db ? -1 : da > db ? 1 : a.label.localeCompare(b.label, 'ja');
  });

  function planRow(p, kind, pj) {
    const d = p.date ? daysUntil(p.date) : null;
    const rel = d === null ? '' : d > 1 ? `あと${d}日` : d === 1 ? '明日' : d === 0 ? '今日' : `${-d}日過ぎ`;
    const meta = `${p.date ? mdw(p.date) : '日付未定'}${rel ? '　' + rel : ''}${p.memo ? `（${esc(p.memo)}）` : ''}`;
    let st = '';
    if (kind === 'out') st = statusHTML(pj.st[p.id], d);
    else if (d !== null && d < 0) st = '<span class="st"><i class="dot warn"></i><span>予定日を過ぎています。受け取ったら「受取」を押してください</span></span>';
    return `<div class="prow">
  <button type="button" class="prow-main" data-act="editPlan" data-kind="${kind}" data-id="${esc(p.id)}">
    <span class="p-label">${esc(p.label)}${p.repeat ? '<span class="rep">毎月</span>' : ''}</span>
    <span class="p-meta">${meta}</span>${st}
  </button>
  <div class="prow-side">
    <span class="amt${kind === 'in' ? ' pos' : ''}">${kind === 'in' ? '+' : '−'}${yen(p.amount)}</span>
    <button type="button" class="done-btn ${kind}" data-act="complete" data-kind="${kind}" data-id="${esc(p.id)}">${kind === 'in' ? '受取' : '支払'}</button>
  </div>
</div>`;
  }

  /* 予定支出ごとに「その日までに間に合うか」を出す。
     間に合う＝今の残高＋その日までに入る予定収入で、その日までの予定支出を全部払える */
  function statusHTML(s, d) {
    if (!s) return '';
    const sub = (t) => `<span class="st-sub">${t}</span>`;
    const st = (cls, t) => `<span class="st"><i class="dot ${cls}"></i><span>${t}</span></span>`;
    if (s.short <= 0) {
      if (d !== null && d < 0) return st('warn', '予定日を過ぎています。払ったら「支払」を押してください');
      if (d === null) return st('ok', '今の残高で払えます');
      return st('ok', `間に合う（払ったあと残り ${yenNW(s.after)}）`);
    }
    const need = yenNW(s.short);
    if (d === null) return st('bad', `今の残高だと ${need} 足りません`);
    let h;
    if (d < 0) h = st('bad', `予定日を過ぎています。あと ${need} 必要`);
    else if (d === 0) h = st('bad', `今日の支払いに ${need} 足りません`);
    else if (d <= 7) h = st('bad', `間に合いません。あと ${need} 必要（残り${d}日）`);
    else {
      const weeks = Math.ceil(d / 7);
      const pace = Math.ceil(s.short / weeks / 10) * 10;
      h = st('warn', `このままだと間に合いません。あと ${need} 必要`) + sub(`週${yenNW(pace)}ずつ貯めれば間に合います`);
    }
    if (s.nextIn) h += sub(`${md(s.nextIn.date)}の「${esc(s.nextIn.label)}」+${yen(s.nextIn.amount)} は、支払日より後なので間に合いません`);
    return h;
  }

  function entryRow(h) {
    let icon, title, sub, amt, cls;
    if (h.kind === 'move') {
      icon = ic('move'); title = h.memo || '移動'; sub = `${accName(h.from)} → ${accName(h.to)}`; amt = yen(h.amount); cls = 'mv';
    } else if (h.kind === 'adj') {
      icon = catIcon(h.cat, 'out'); title = h.amount < 0 ? '使途不明' : '増えた分'; sub = `残高合わせ／${accName(h.acc)}`; amt = yenSigned(h.amount); cls = h.amount < 0 ? 'neg' : 'pos';
    } else {
      icon = catIcon(h.cat, h.kind); title = h.memo || h.cat || (h.kind === 'out' ? '支出' : '収入');
      sub = h.memo && h.memo !== h.cat ? `${h.cat || 'その他'}／${accName(h.acc)}` : accName(h.acc);
      amt = (h.kind === 'out' ? '−' : '+') + yen(h.amount); cls = h.kind === 'out' ? 'neg' : 'pos';
    }
    return `<button type="button" class="entry" data-act="entry" data-id="${esc(h.id)}"><span class="e-ic">${icon}</span><span class="e-main"><span class="e-t">${esc(title)}</span><span class="e-s">${esc(sub)}</span></span><span class="e-a ${cls}">${amt}</span></button>`;
  }

  function historyHTML() {
    const st = monthStats(histMonth);
    const cur = today().slice(0, 7);
    const [y, m] = histMonth.split('-').map(Number);
    const list = data.history
      .filter((h) => h.date.startsWith(histMonth))
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts));

    const days = [];
    for (const h of list) {
      const last = days[days.length - 1];
      if (last && last.date === h.date) last.items.push(h); else days.push({ date: h.date, items: [h] });
    }
    const groups = days.map((g) => {
      const out = g.items.reduce((s, h) => s + (h.kind === 'out' ? h.amount : h.kind === 'adj' && h.amount < 0 ? -h.amount : 0), 0);
      return `<div class="day"><span>${mdw(g.date)}</span>${out ? `<span>−${yen(out)}</span>` : ''}</div><div class="entries">${g.items.map(entryRow).join('')}</div>`;
    }).join('');

    const cats = Object.entries(st.out).sort((a, b) => b[1] - a[1]).map(([c, v]) => {
      const pct = (v / st.tout) * 100;
      return `<div class="cat-row"><span class="cat-e">${catIcon(c, 'out')}</span><div class="cat-main"><div class="cat-top"><span>${esc(c)}</span><span>${yen(v)}</span></div><div class="cat-bar${c === '使途不明' ? ' unk' : ''}"><i style="width:${pct.toFixed(1)}%"></i></div></div><span class="cat-pct">${Math.round(pct)}%</span></div>`;
    }).join('');

    return `
<header class="top">
  <div><p class="top-date">${mdw(today())}</p><h1>履歴</h1></div>
  <button type="button" class="icon-btn" data-act="settings" aria-label="設定">${GEAR}</button>
</header>
<div class="content">
<section class="section summary">
  <div class="month-nav"><button type="button" data-act="month" data-d="-1" aria-label="前の月">${ic('back')}</button><span>${y}年${m}月</span><button type="button" data-act="month" data-d="1" aria-label="次の月"${histMonth >= cur ? ' disabled' : ''}>${ic('chevron')}</button></div>
  <div class="hist-sum"><div><span>支出</span><b>${yen(st.tout)}</b></div><div><span>収入</span><b>${yen(st.tin)}</b></div></div>
</section>
  <section class="section"><div class="sec-head"><span class="sec-title">月ごとの支出</span><span class="sec-note">棒をタップで切り替え</span></div>${chartSVG()}</section>
  <section class="section"><div class="sec-head"><span class="sec-title">${m}月のカテゴリ別</span></div>${cats || '<div class="empty">この月の支出はまだありません。</div>'}</section>
  <section class="section"><div class="sec-head"><span class="sec-title">${m}月の記録</span><span class="sec-note">${list.length}件</span></div>${groups || '<div class="empty">記録がありません。下の＋から記録できます。</div>'}</section>
</div>`;
  }

  function chartSVG() {
    const cur = today().slice(0, 7);
    const end = histMonth > shiftMonth(cur, -6) ? cur : histMonth;
    const months = Array.from({ length: 6 }, (_, i) => shiftMonth(end, i - 5));
    const vals = months.map((mm) => monthStats(mm).tout);
    const max = Math.max(...vals, 1);
    const W = 330, H = 156, T = 22, BM = 24, slot = W / 6, bw = 28;
    const bars = months.map((mm, i) => {
      const v = vals[i];
      const h = v ? Math.max(4, Math.round(((H - T - BM) * v) / max)) : 0;
      const x = slot * i + (slot - bw) / 2;
      const y = H - BM - h;
      return `<g class="${mm === histMonth ? 'sel' : ''}" data-act="pickMonth" data-m="${mm}"><rect x="${slot * i}" y="0" width="${slot}" height="${H}" fill="transparent"/>${h ? `<rect class="b" x="${x}" y="${y}" width="${bw}" height="${h}" rx="4"/>` : ''}<text class="v" x="${x + bw / 2}" y="${(h ? y : H - BM) - 6}">${v ? yenShort(v) : '0'}</text><text class="m" x="${x + bw / 2}" y="${H - 6}">${+mm.slice(5)}月</text></g>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="月ごとの支出のグラフ"><line class="base" x1="0" y1="${H - BM + 0.5}" x2="${W}" y2="${H - BM + 0.5}"/>${bars}</svg>`;
  }

  /* ===== シート（下から出る画面） ===== */
  function openSheet({ title, body, foot = '', cls = '', focus = null }) {
    hideToast();
    const root = sheetEl();
    root.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab" aria-hidden="true"></div><div class="sheet-head"><span class="sheet-title">${esc(title)}</span><button type="button" class="close-btn" data-act="close" aria-label="閉じる">${ic('x')}</button></div><div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div>`;
    root.classList.add('show');
    document.documentElement.classList.add('lock');
    fitViewport();
    if (focus) {
      const el = $(focus, root);
      if (el) { try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); } }
    }
  }
  function closeSheet() {
    const root = sheetEl();
    if (document.activeElement && root.contains(document.activeElement)) document.activeElement.blur();
    root.classList.remove('show');
    root.innerHTML = '';
    document.documentElement.classList.remove('lock');
    form = null;
  }
  function flash(sel) {
    const el = typeof sel === 'string' ? $(sel, sheetEl()) : sel;
    if (!el) return;
    const box = el.closest('.amount-box') || el;
    box.classList.remove('err'); void box.offsetWidth; box.classList.add('err');
    setTimeout(() => box.classList.remove('err'), 700);
  }

  const amountBox = (id, value, opts = {}) => {
    const v = value === '' || value == null ? '' : Number(value).toLocaleString('ja-JP');
    return `<div class="amount-box${opts.sm ? ' sm' : ''}"><span class="ym">¥</span><input id="${id}" class="num${opts.signed ? ' signed' : ''}" inputmode="numeric"${opts.signed ? '' : ' pattern="[0-9]*"'} autocomplete="off" enterkeyhint="done" placeholder="${esc(opts.placeholder || '0')}" value="${esc(v)}" aria-label="金額">${opts.signed ? `<button type="button" class="sign-btn" data-act="flipSign" data-for="${id}" aria-label="プラス・マイナスを切り替え">±</button>` : ''}</div>`;
  };
  const accChips = (field, sel) => `<div class="chips">${data.accounts.map((a) => `<button type="button" class="chip${a.id === sel ? ' on' : ''}" data-act="pick" data-field="${field}" data-v="${esc(a.id)}"><span>${esc(a.label)}</span><small>${yen(a.amount)}</small></button>`).join('')}</div>`;
  const catGrid = (kind, sel) => `<div class="cats">${catList(kind).map(([c, e]) => `<button type="button" class="cat${sel === c ? ' on' : ''}" data-act="pick" data-field="cat" data-v="${esc(c)}">${ic(e)}<span>${esc(c)}</span></button>`).join('')}</div>`;
  const datePick = (field, v) => `<label class="datepick${v ? '' : ' empty'}">${ic('calendar')}<span class="dp-t">${v ? relDay(v) : '未定'}</span><input type="date" class="date-in" data-field="${field}" value="${v || ''}" aria-label="日付"></label>`;

  /* --- 記録する（支出・収入・移動） --- */
  function openRecord(opts = {}) {
    if (!data.accounts.length) { toast('先に口座を追加してください'); return; }
    const h = opts.edit ? data.history.find((x) => x.id === opts.edit) : null;
    const kind = h ? h.kind : opts.kind || 'out';
    if (kind === 'move' && data.accounts.length < 2) { toast('移動には口座が2つ以上必要です'); return; }
    form = { type: 'record', id: h ? h.id : null, kind, amount: h ? h.amount : '', cat: h ? h.cat : null, acc: h && h.acc ? h.acc : defAcc(kind === 'in' ? 'in' : 'out'), date: h ? h.date : today(), memo: h ? h.memo : '', quick: [] };
    const lm = data.prefs.lastMove || {};
    form.from = h && h.from ? h.from : acct(lm.from) ? lm.from : data.accounts[0].id;
    form.to = h && h.to ? h.to : acct(lm.to) && lm.to !== form.from ? lm.to : (data.accounts.find((a) => a.id !== form.from) || {}).id || null;
    openSheet({ title: h ? '記録を直す' : '記録する', body: recordBody(), foot: recordFoot(), cls: 'k-' + kind, focus: !h && kind === 'move' ? '#fAmount' : null });
  }

  function recordBody() {
    const f = form, k = f.kind;
    let h = `<div class="seg">${[['out', '支出'], ['in', '収入'], ['move', '移動']].map(([v, l]) => `<button type="button" class="${k === v ? 'on' : ''}" data-act="seg" data-v="${v}">${l}</button>`).join('')}</div>`;

  /* --- バックアップ --- */
  function download(text, name) {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function exportBackup() {
    const now = new Date();
    const json = JSON.stringify({ app: 'shikin-kanri', version: 2, exportedAt: now.toISOString(), data }, null, 1);
    const name = `資金管理_${ymdOf(now).replace(/-/g, '')}.json`;
    const done = () => {
      data.prefs.lastBackup = Date.now();
      save(); render();
      if (form && form.type === 'settings') openSettings();
      toast('バックアップを保存しました');
    };
    let file = null;
    if (navigator.canShare) {
      for (const type of ['application/json', 'text/plain']) {
        try { const f = new File([json], name, { type }); if (navigator.canShare({ files: [f] })) { file = f; break; } } catch (_) { /* 次を試す */ }
      }
    }
    if (file) {
      navigator.share({ files: [file] }).then(done).catch((err) => {
        if (err && err.name === 'AbortError') return; // 共有をやめたとき
        download(json, name); done();
      });
    } else {
      download(json, name); done();
    }
  }
  async function handleImport(file) {
    if (!file) return;
    let obj;
    try { obj = JSON.parse(await file.text()); } catch (_) { toast('読み込めませんでした。バックアップのファイルか確認してください'); return; }
    let d;
    const src = obj && obj.data && (obj.app === 'shikin-kanri' || obj.version) ? obj.data : obj;
    try { d = normalize(src); } catch (_) { toast('このファイルは資金管理のバックアップではないようです'); return; }
    const when = obj && obj.exportedAt ? Date.parse(obj.exportedAt) : null;
    const summary = `口座${d.accounts.length}件・予定${d.incomes.length + d.expenses.length}件・記録${d.history.length}件`;
    confirmSheet({
      title: 'バックアップから復元',
      msg: `${when ? fmtDateTime(when) + ' に保存した' : 'この'}データ（${summary}）で、今のデータを置き換えます。`,
      ok: '復元する', danger: false,
      onOk: () => {
        try { localStorage.setItem(KEY + '.before-restore', JSON.stringify(data)); } catch (_) { /* 退避できなくても続ける */ }
        const prefs = Object.assign({}, data.prefs, { lastBackup: when || Date.now(), introSeen: true, migratedAt: data.prefs.migratedAt || d.prefs.migratedAt });
        commit('復元しました', () => { data = Object.assign(d, { prefs }); });
      },
    });
  }

  function formatNum(el) {
    const signed = el.classList.contains('signed');
    const n = signed ? toIntSigned(el.value) : toInt(el.value);
    el.value = isNaN(n) ? (signed && /^[-−]/.test(el.value.trim()) ? '-' : '') : n.toLocaleString('ja-JP');
  }
  function flipSign(el) {
    const inp = $('#' + el.dataset.for, sheetEl());
    if (!inp) return;
    const v = inp.value.trim();
    inp.value = /^[-−]/.test(v) ? v.replace(/^[-−]\s*/, '') : '-' + v;
    formatNum(inp);
    markDirty();
  }
  function onDateChange(el) {
    if (!form) return;
    let v = el.value;
    if (!v && form.type !== 'plan') { v = today(); el.value = v; }
    form[el.dataset.field] = v;
    markDirty();
    const wrap = el.closest('.datepick');
    wrap.classList.toggle('empty', !v);
    $('.dp-t', wrap).textContent = v ? relDay(v) : '未定';
    if (form.type === 'plan') {
      const clr = $('[data-act="dateClear"]', sheetEl());
      if (clr) clr.hidden = !v;
      const rep = $('#fRepeat');
      rep.disabled = !v;
      if (!v) rep.checked = false;
      $('#repWrap').classList.toggle('disabled', !v);
    }
  }
  const markDirty = () => { if (form) form.dirty = true; };
  function pick(el) {
    if (!form) return;
    markDirty();
    const field = el.dataset.field, v = el.dataset.v, prev = form[field];
    form[field] = v;
    const sync = (f) => $$(`[data-act="pick"][data-field="${f}"]`, sheetEl()).forEach((b) => b.classList.toggle('on', b.dataset.v === form[f]));
    if (field === 'from' || field === 'to') {
      const other = field === 'from' ? 'to' : 'from';
      if (form[other] === v) {
        form[other] = prev && prev !== v ? prev : (data.accounts.find((a) => a.id !== v) || {}).id || null;
        sync(other);
      }
    }
    sync(field);
    if (field === 'cat' && form.type === 'record') {
      const a = $('#fAmount');
      if (a && !toInt(a.value)) a.focus({ preventScroll: true });
    }
  }

  /* ===== テーマ・画面サイズ ===== */
  function applyTheme() {
    const t = data.prefs.theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
    // ステータスバーの色を、ページの背景色にそろえる
    const L = '#f4f5f7', D = '#0f1115';
    const ml = document.getElementById('tcLight'), md2 = document.getElementById('tcDark');
    if (ml) ml.content = t === 'dark' ? D : L;
    if (md2) md2.content = t === 'light' ? L : D;
  }
  function fitViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    const r = document.documentElement;
    r.style.setProperty('--vv-top', vv.offsetTop + 'px');
    r.style.setProperty('--vv-h', vv.height + 'px');
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    r.style.setProperty('--kb', kb + 'px');
    r.classList.toggle('kb', kb > 120);
  }

  /* ===== 操作の受け付け ===== */
  document.addEventListener('click', (e) => {
    const root = sheetEl();
    if (e.target === root) {
      if (form && form.dirty) toast('入力中です。閉じるときは右上の×を押してください');
      else closeSheet();
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const { act, id, kind } = el.dataset;
    switch (act) {
      case 'tab': tab = el.dataset.tab; window.scrollTo(0, 0); render(); break;
      case 'record': openRecord({ kind: kind || 'out' }); break;
      case 'settings': openSettings(); break;
      case 'help': openHelp(); break;
      case 'close': closeSheet(); break;
      case 'undo': if (undoFn) { const f = undoFn; hideToast(); f(); } break;
      case 'introHelp': data.prefs.introSeen = true; save(); render(); openHelp(); break;
      case 'introClose': data.prefs.introSeen = true; save(); render(); break;
      case 'export': exportBackup(); break;
      case 'theme':
        data.prefs.theme = el.dataset.v; save(); applyTheme();
        $$('[data-act="theme"]', root).forEach((b) => b.classList.toggle('on', b === el));
        break;
      case 'month': {
        const cur = today().slice(0, 7);
        const m = shiftMonth(histMonth, +el.dataset.d);
        histMonth = m > cur ? cur : m;
        render(); break;
      }
      case 'pickMonth': histMonth = el.dataset.m; render(); break;
      case 'account': openAccount(id); break;
      case 'addAccount': openAccountForm(null); break;
      case 'editAccount': if (form) openAccountForm(form.id); break;
      case 'delAccount': if (form) askDeleteAccount(form.id); break;
      case 'submitAccount': submitAccount(); break;
      case 'reconcile': submitReconcile(); break;
      case 'addPlan': openPlan(kind, null); break;
      case 'editPlan': openPlan(kind, id); break;
      case 'dateClear': clearPlanDate(); break;
      case 'submitPlan': submitPlan(); break;
      case 'delPlan': deletePlan(); break;
      case 'complete': openComplete(kind, id); break;
      case 'submitComplete': submitComplete(); break;
      case 'seg': switchKind(el.dataset.v); break;
      case 'pick': pick(el); break;
      case 'flipSign': flipSign(el); break;
      case 'quick': quickRecord(+el.dataset.i); break;
      case 'submitRecord': submitRecord(); break;
      case 'entry': openEntry(id); break;
      case 'delEntry': { const hid = form && form.id; closeSheet(); if (hid) commit('記録を削除しました', () => removeEntry(hid)); break; }
      case 'confirmOk': { const fn = form && form.onOk; closeSheet(); if (fn) fn(); break; }
      default: break;
    }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (sheetEl().contains(el) && el.type !== 'file') markDirty();
    if (el.classList.contains('num')) formatNum(el);
    if (el.id === 'fActual') updateAdjPreview();
    if (el.classList.contains('date-in')) onDateChange(el);
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.classList.contains('date-in')) onDateChange(el);
    if (el.id === 'importFile') { const f = el.files && el.files[0]; el.value = ''; handleImport(f); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !form || !e.target.matches('.sheet input')) return;
    e.preventDefault();
    if (form.type === 'account') { submitReconcile(); return; }
    const btn = $('.sheet-foot .btn:not(.ghost)', sheetEl());
    if (btn) btn.click(); else e.target.blur();
  });
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (t.matches && t.matches('.sheet-body input.inp, .sheet-body input.num')) {
      setTimeout(() => { try { t.scrollIntoView({ block: 'nearest' }); } catch (_) { /* 古い端末 */ } }, 350);
    }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !form) render(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', fitViewport);
  }

  /* ===== はじめに ===== */
  applyTheme();
  fitViewport();
  render();
  if (justMigrated) toast('前のデータを引き継ぎました');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (_) { /* 非対応 */ }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();

</script>
</body>
</html>
